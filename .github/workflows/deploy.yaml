name: Build and Deploy to Rahti

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile # Adjust this path if your Dockerfile is elsewhere
          push: true
          tags: ghcr.io/teresasdesign/backend:latest

      - name: Log in to OpenShift (Rahti)
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}
          insecure_skip_tls_verify: true

      - name: Update Rahti Deployment Image
        run: |
          oc set image deployment/backend backend=ghcr.io/teresasdesign/backend:latest
          oc rollout status deployment/backend
