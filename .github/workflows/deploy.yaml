name: Build and Deploy to Rahti

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/teresasdesign/backend:latest

      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: Log in to OpenShift (Rahti)
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}
          insecure_skip_tls_verify: true

      - name: Update deployments on Rahti
        run: |
          oc set image deployment/backend backend=ghcr.io/teresasdesign/backend:latest -n ${{ secrets.OPENSHIFT_NAMESPACE }}
          oc set image deployment/frontend frontend=ghcr.io/teresasdesign/backend:latest -n ${{ secrets.OPENSHIFT_NAMESPACE }}
          oc rollout restart deployment/backend -n ${{ secrets.OPENSHIFT_NAMESPACE }}
          oc rollout restart deployment/frontend -n ${{ secrets.OPENSHIFT_NAMESPACE }}
